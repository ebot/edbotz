<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/pico/pico.min.css">
    <style type="text/css">
      :root {
        --header-footer-color: #d4b725;
      }
      html, body {
        margin: 0;
        background-color: black;
        height: 100%;
      }
      main { background-color: var(--pico-background-color); }
      header, footer {
        background-color: black;
        color: var(--header-footer-color);
      }
      header {
        border-bottom: 2px solid var(--header-footer-color);
        width: 100%;
      }
      header.grid{ margin-bottom: 0; padding-bottom:0; }
      header > div > h1 {
        color: var(--header-footer-color);
        font-size: 350%;
      }
    </style>
    <title>edbotz.us</title>
  </head>
  <body>
    <header class="grid">
      <div><img src="images/headers/july_4_header.png" width="450px"/></div>
      <div><h1 class="title">EdBotz</h1></div>
    </header>
    <main class="container-fluid grid">
      <div class="container">
        <h1>Content Here</h1>
      </div>
    </main>
    <footer class="container grid">
      <div>
        <img src="images/keystone_shadow.png" width="95px" height="95px" alt="keystone shadow">
        Built by Ed Botzum <br>
        Crafting code since 1998
      </div>
      <div>
        Version 4.0 ~ Est 2026<br>
        Previous Versions: <a href="http://www.flickr.com/photos/ebot/8167716204">3.0</a> <a href="http://www.flickr.com/photos/ebot/8167716204">2.0</a>
      </div>
    </footer>
  </body>
</html>
